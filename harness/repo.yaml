# The disposable public repository the sandbox is built from (IP-005 section 2).
# Public, dual-licensed; pinned by commit. The export carries its licence texts,
# NOTICE and attribution. Only the public URL and public upstream model ids are
# external names recorded in this repository.
repository:
  url: https://github.com/abliter8-ai/filmcraft
  upstream: https://github.com/storytold/filmcraft
  commit: 7b6c134472287db4367fca80bcb498240ba36567
  default_branch: main
  spdx_license: MIT OR Apache-2.0
  license_files: [LICENSE-MIT, LICENSE-APACHE]
  notice_file: NOTICE
  attribution_file: ATTRIBUTION.md
  size_mb: 52
  workspace:
    language: rust
    edition: "2024"
    rust_version: "1.95"
    resolver: "3"
    unsafe_code: forbid
  # Small leaf crates used by the single-crate tasks, so a run stays short.
  task_crates: [time, color, cfb, scopes, geom]
toolchain:
  rust: "1.95"
build:
  base_image: "rust:1.95-bookworm"
  system_packages: [libasound2-dev, libgtk-3-dev, pkg-config, git, ca-certificates]
  vendored: true          # cargo vendor at build time; runs have no network
  warm_build_crates: [filmcraft-time, filmcraft-color, filmcraft-cfb, filmcraft-scopes]
  note: >
    Network is used only at image build time. ffmpeg is not installed, so the
    oracle tests skip, as the repository documents. The UI/app crates are not
    warm-built because the tasks do not touch them; they would pay a one-time
    cold compile if a run reached them.
